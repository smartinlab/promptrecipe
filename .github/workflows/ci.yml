name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories are published after a version is pinned, so a one-off audit
    # goes stale. Re-run weekly against the same pinned versions.
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest
      - name: Quickstart walkthrough (metric M11 — fails over 30 minutes)
        run: python scripts/quickstart_walkthrough.py
      - name: Performance budget (TRD §8)
        # One interpreter only: a benchmark across the full matrix measures
        # runner noise more than it measures this library.
        if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        run: python scripts/benchmark.py

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]" pip-audit
      - name: Audit
        run: pip-audit --strict --requirement requirements-dev.lock
      - name: Supply-chain assertions
        run: python scripts/check_supply_chain.py
